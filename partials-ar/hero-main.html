<section class="nds-hero-section wwf-hero-section" aria-label="واجهة الحدث الرئيسية">
    <div class="nds-swiper nds-hero nds-oncolor nds-full-width wwf-hero" style="--total: 1">
        <div class="nds-swiper-wrapper wwf-hero__wrapper">
            <div class="nds-swiper-slide wwf-hero__slide">
                <div class="nds-hero-image-wrapper wwf-hero__media" aria-hidden="true">
                    <video id="hero-video" class="wwf-hero__video" autoplay muted loop playsinline preload="metadata"
                        poster="theme/media/hero-poster.webp" data-src="theme/media/hero-video.mp4"></video>
                </div>

                <div class="nds-section-body nds-content-wrapper wwf-hero__content">
                    <h1 class="nds-section-title wwf-hero__title">المنتدى العالمي الحادي عشر للمياه</h1>
                    <p class="nds-section-description wwf-hero__tagline">عمل من أجل غد أفضل</p>

                    <p class="wwf-hero__meta" aria-label="من 21 إلى 25 مارس 2027 في الرياض، المملكة العربية السعودية">
                        <span class="wwf-hero__meta-item">
                            <i class="nds-icon nds-hgi-calendar-03" aria-hidden="true"></i>
                            <time datetime="2027-03-21">21-25 مارس 2027</time>
                        </span>
                        <span class="wwf-hero__meta-separator" aria-hidden="true"></span>
                        <span class="wwf-hero__meta-item">
                            <i class="nds-icon nds-hgi-location-01" aria-hidden="true"></i>
                            <span>الرياض، المملكة العربية السعودية</span>
                        </span>
                    </p>

                    <!-- غيّر هذا التاريخ بصيغة ISO لتحديث العدّاد. أبقِ فرق التوقيت مكتوباً صراحةً. -->
                    <div class="wwf-countdown" data-countdown-target="2027-03-21T00:00:00+03:00"
                        role="timer" aria-live="off"
                        aria-label="العد التنازلي لانطلاق المنتدى"
                        data-countdown-label="{d} يوم و{h} ساعة و{m} دقيقة و{s} ثانية حتى انطلاق المنتدى">
                        <div class="wwf-countdown__item">
                            <span class="wwf-countdown__value" data-countdown-unit="days">0</span>
                            <span class="wwf-countdown__label">يوم</span>
                        </div>
                        <div class="wwf-countdown__item">
                            <span class="wwf-countdown__value" data-countdown-unit="hours">00</span>
                            <span class="wwf-countdown__label">ساعة</span>
                        </div>
                        <div class="wwf-countdown__item">
                            <span class="wwf-countdown__value" data-countdown-unit="minutes">00</span>
                            <span class="wwf-countdown__label">دقيقة</span>
                        </div>
                        <div class="wwf-countdown__item">
                            <span class="wwf-countdown__value" data-countdown-unit="seconds">00</span>
                            <span class="wwf-countdown__label">ثانية</span>
                        </div>
                    </div>

                    <a href="pages/participation-opportunities-ar.html" class="nds-btn nds-primary nds-oncolor nds-lg wwf-hero__cta">
                        <span class="nds-label">اعرف المزيد</span>
                        <i class="nds-icon nds-hgi-arrow-left-01" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="nds-swiper-navigation">
            <div class="nds-swiper-buttons">
                <button class="nds-btn nds-subtle nds-icon-only nds-oncolor nds-prev" aria-label="الشريحة السابقة"
                    hidden></button>
                <button class="nds-btn nds-subtle nds-icon-only nds-oncolor nds-next" aria-label="الشريحة التالية"
                    hidden></button>
            </div>
            <div class="nds-swiper-pagination" hidden></div>
        </div>
    </div>
</section>
