<!-- شريط ملفات تعريف الارتباط -->
<div class="nds-cookie-popup nds-card" id="ndsCookiesPopup" hidden>
    <div class="nds-card-header">
        <span class="nds-featured-icon nds-circle">
            <i class="nds-icon nds-hgi-cookie" aria-hidden="true"></i>
        </span>
        <button id="ndsCookiesCloseBtn" class="nds-close nds-btn nds-subtle" aria-label="إغلاق">
            <i class="nds-icon nds-hgi-cancel-01" aria-hidden="true"></i>
        </button>
    </div>
    <div class="nds-card-content">
        <div class="nds-card-text">
            <h3 class="nds-card-title" id="ndsCookiesTitle">ملفات تعريف الارتباط</h3>
            <p class="nds-card-description" id="ndsCookiesContent">يستخدم هذا الموقع ملفات تعريف الارتباط لتسهيل الاستخدام وتحسين تجربة التصفح. باستمرارك في تصفح الموقع فإنك تقر بذلك وتوافق على استخدامها.</p>
        </div>
        <div class="nds-cookie-popup-links">
            <a href="#" id="ndsCookiesTermsLink">الشروط والأحكام</a>
            <span>|</span>
            <a href="#" id="ndsCookiesPrivacyLink">سياسة الخصوصية</a>
        </div>
    </div>
    <div class="nds-card-actions">
        <button class="nds-btn nds-primary nds-full" id="ndsCookiesAcceptBtn" data-accept-title="تم القبول"
            data-accept-message="تم قبول ملفات تعريف الارتباط">
            <span class="nds-label">موافق</span>
        </button>
        <button class="nds-btn nds-secondary nds-full" id="ndsCookiesDeclineBtn" data-decline-title="تم الرفض"
            data-decline-message="تم رفض ملفات تعريف الارتباط الاختيارية">
            <span class="nds-label">رفض</span>
        </button>
    </div>
</div>
